[project]
name = "text-to-image-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kamrul-Islam-Octopi", email = "kamrul.islam@octopi-digital.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "diffusers>=0.41.0",
    "fastapi>=0.143.0",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "safetensors>=0.8.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.19.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
text-to-image-backend = "text_to_image_backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
